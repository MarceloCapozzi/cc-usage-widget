[package]
name = "cc-core"
description = "Spool event format, session vocabulary, state machine, data paths, atomic file writes and process tree containment shared by cc-usage, cc-hook and cc-publish"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
serde.workspace = true
sha2 = { version = "0.10", default-features = false }

[target.'cfg(unix)'.dependencies]
# kill() of a contained child's process group (`process_tree`).
libc = "0.2"

[target.'cfg(windows)'.dependencies]
# Job objects for `process_tree`.
windows-sys = { workspace = true, features = ["Win32_Foundation", "Win32_Security", "Win32_System_JobObjects", "Win32_System_Threading"] }

[dev-dependencies]
serde_json.workspace = true
