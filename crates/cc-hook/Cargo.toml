[package]
name = "cc-hook"
description = "Claude Code hook receiver: writes one spool event per hook call, and installs itself into settings.json"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[lib]
name = "cc_hook"
path = "src/lib.rs"

[[bin]]
name = "cc-hook"
path = "src/main.rs"

[dependencies]
cc-core.workspace = true
# preserve_order keeps settings.json keys in their original order on rewrite.
serde.workspace = true
serde_json = { workspace = true, features = ["preserve_order"] }

[target.'cfg(windows)'.dependencies]
# Process inspection for `procs`. The chained status line's job object is
# cc_core::process_tree.
windows-sys = { workspace = true, features = [
  "Win32_Foundation",
  "Win32_System_Diagnostics_ToolHelp",
  "Win32_System_Kernel",
  "Win32_System_Threading",
  "Wdk_System_Threading",
] }

[dev-dependencies]
tempfile.workspace = true
