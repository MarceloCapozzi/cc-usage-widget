[package]
name = "cc-publish"
description = "Publishes this machine's Claude Code sessions, encrypted, to the cc-sessions NATS KV bucket for the cc-usage widget on another machine"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[[bin]]
name = "cc-publish"
path = "src/main.rs"

[dependencies]
cc-core.workspace = true
cc-local.workspace = true
cc-envelope.workspace = true
cc-remote.workspace = true
base64.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
# Current-thread runtime: one connection, a handful of tasks.
tokio = { workspace = true, features = ["rt", "macros", "time", "sync", "signal"] }
tracing.workspace = true
tracing-subscriber = { version = "0.3", default-features = false, features = ["fmt", "std", "registry"] }

[dev-dependencies]
tempfile.workspace = true
# tests/local_nats.rs: the bucket set-up on a local nats-server, a fresh user
# seed for its throwaway creds, and the TLS front it puts before the server
# (cc-remote connects only over TLS). All already in the tree through
# async-nats, except rcgen, which makes the front's CA and certificate at run
# time (no key material in the repository), with the same ring.
async-nats.workspace = true
futures-util.workspace = true
nkeys = "0.4"
rcgen = { version = "0.14", default-features = false, features = ["crypto", "pem", "ring"] }
tokio = { workspace = true, features = ["io-util", "net", "rt-multi-thread"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring"] }
